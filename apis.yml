aid: blue-river-technology
name: Blue River Technology
description: >-
  Blue River Technology is an agricultural robotics and machine-learning company headquartered in
  Santa Clara, California, and a wholly owned subsidiary of John Deere (Deere & Company), which
  acquired it in 2017. Founded in 2011 by Jorge Heraud and Lee Redden out of Stanford University, the
  company builds intelligent machinery that combines computer vision, machine learning, robotics, and
  full-stack software to make farming more precise and sustainable. Its flagship product, See & Spray,
  uses onboard cameras and deep-learning models to distinguish crops from weeds in real time and
  target herbicide only where it is needed, dramatically reducing chemical use. Blue River operates as
  John Deere's autonomy and computer-vision engineering hub, applying the same perception and
  edge-AI stack across agriculture, construction, and mining equipment. The company does not publish a
  public developer API, SDK, or documentation portal; its technology ships embedded in John Deere
  machinery and is surfaced to growers through John Deere Operations Center rather than a standalone
  developer program.
